# Host nginx vhost for safarchin.hiagent.me
#
# This runs on the SERVER's nginx (the one already serving your other sites),
# NOT inside Docker. It reverse-proxies the domain to the frontend and backend
# containers, published on 127.0.0.1:3025 and 127.0.0.1:8125 by
# docker-compose.prod.yml.
#
# Install:
#   sudo cp deploy/nginx-safarchin.conf /etc/nginx/sites-available/safarchin.hiagent.me
#   sudo ln -s /etc/nginx/sites-available/safarchin.hiagent.me /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a TLS cert (Let's Encrypt). With the certbot nginx plugin:
#   sudo certbot --nginx -d safarchin.hiagent.me
# certbot will edit this file to add the listen 443 / ssl_certificate lines and
# an HTTP->HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name safarchin.hiagent.me;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://127.0.0.1:8125;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8125;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8125;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3025;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / streaming support, in case it's used.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
